name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom@30 richiede Node ^22.22.2 || ^24.15.0 || >=26 — fissato
          # a 22 (LTS attuale, allineato all'ambiente locale /opt/node22).
          # Vitest 2 e @vitejs/plugin-react supportano Node 22. Node 20 è
          # EOL ad aprile 2026, questo migra prima della scadenza.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Unit tests (vitest) — include RLS smoke contro Supabase live
        run: npm test

      - name: Build (verifica che il bundle generi)
        run: npm run build
        env:
          # Variabili richieste da Supabase client. Valori placeholder sufficienti
          # per il build (il client viene inizializzato al runtime, non a build time).
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.ci-placeholder.sig

      - name: Audit (production only, no fail su high transitive)
        run: npm audit --omit=dev --audit-level=critical || true

  # Smoke E2E contro produzione (lenci-poirino-app.netlify.app).
  # Gira solo su push a main, non su PR (sarebbe inutile: la PR non è
  # ancora live). Fallisce se il bundle appena deployato ha rotto il
  # bootstrap React, SPA fallback, service worker o /version.json.
  e2e-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Non blocca il merge: se E2E flaky, apriamo un issue, non blocchiamo i push
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Attendere che il deploy Netlify sia live (polling version.json)
        run: |
          # Diamo a Netlify fino a 3 min per deployare dopo il push
          for i in {1..18}; do
            if curl -sSf https://lenci-poirino-app.netlify.app/version.json > /dev/null; then
              echo "Site reachable, running E2E"
              exit 0
            fi
            echo "attempt $i: waiting 10s for deploy..."
            sleep 10
          done
          echo "::warning::Site non raggiungibile dopo 3 min, E2E saltati"
          exit 0

      - name: E2E Playwright smoke
        run: npx playwright test --project=chromium --reporter=github
        env:
          E2E_BASE_URL: https://lenci-poirino-app.netlify.app
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
